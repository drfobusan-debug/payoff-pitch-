<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1520" viewBox="0 0 1120 1520">
  <rect width="1120" height="1520" fill="#f4f1ea"/>
  <text x="48" y="52" font-family="Georgia, 'Iowan Old Style', Palatino, serif" font-size="28" fill="#1c1915">MLB recode</text>
  <text x="48" y="80" font-family="Georgia, Palatino, serif" font-size="16" fill="#5c564c">The market owns the main line. The simulation owns the shape around it.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#3d3832"/>
    </marker>
    <marker id="arrSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#8a8178"/>
    </marker>
  </defs>

  <!-- inputs -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="112" width="320" height="96" rx="12" fill="#e7f2eb" stroke="#1f6b4a" stroke-width="1.5"/>
    <text x="56" y="146" font-size="15" font-weight="650" fill="#1f6b4a">Frozen rate stack</text>
    <text x="56" y="170" font-size="13" fill="#243028">Statcast, pen, park, weather, lineup</text>
    <text x="56" y="190" font-size="12" fill="#5c564c">Coefficients stay where they are</text>

    <rect x="400" y="112" width="320" height="96" rx="12" fill="#e7eef6" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="416" y="146" font-size="15" font-weight="650" fill="#1d4e89">Board already fetched</text>
    <text x="416" y="170" font-size="13" fill="#1c2430">Both sides, every book</text>
    <text x="416" y="190" font-size="12" fill="#5c564c">No extra Odds API call</text>

    <rect x="760" y="112" width="320" height="96" rx="12" fill="#eeeae4" stroke="#8a8178" stroke-width="1.5"/>
    <text x="776" y="146" font-size="15" font-weight="650" fill="#5c564c">Sheets, report only</text>
    <text x="776" y="170" font-size="13" fill="#3d3832">Worksheet gap and totals SUM</text>
    <text x="776" y="190" font-size="12" fill="#5c564c">Weight 0. Not an input to the pin</text>

    <!-- arrows down from inputs -->
    <line x1="200" y1="208" x2="200" y2="248" stroke="#3d3832" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="560" y1="208" x2="560" y2="248" stroke="#3d3832" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="920" y1="208" x2="920" y2="1048" stroke="#8a8178" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrSoft)"/>

    <rect x="40" y="248" width="320" height="78" rx="12" fill="#e7f2eb" stroke="#1f6b4a" stroke-width="1.5"/>
    <text x="56" y="278" font-size="15" font-weight="650" fill="#1f6b4a">log5 rates</text>
    <text x="56" y="302" font-size="13" fill="#243028">Batter x pitcher / league, then the frozen nudges</text>

    <rect x="400" y="248" width="320" height="78" rx="12" fill="#e7eef6" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="416" y="278" font-size="15" font-weight="650" fill="#1d4e89">Quote tape, then devig</text>
    <text x="416" y="302" font-size="13" fill="#1c2430">Main line only. One-sided quotes are not a pin</text>

    <line x1="200" y1="326" x2="200" y2="366" stroke="#3d3832" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="40" y="366" width="320" height="92" rx="12" fill="#e7f2eb" stroke="#1f6b4a" stroke-width="1.5"/>
    <text x="56" y="398" font-size="15" font-weight="650" fill="#1f6b4a">Monte Carlo paths</text>
    <text x="56" y="422" font-size="13" fill="#243028">Game, first five, batter and pitcher counts</text>
    <text x="56" y="442" font-size="12" fill="#5c564c">One generator. 20,000 draws</text>

    <rect x="400" y="366" width="320" height="92" rx="12" fill="#f7f1e4" stroke="#8a5a00" stroke-width="1.5"/>
    <text x="416" y="398" font-size="15" font-weight="650" fill="#8a5a00">Markov chain</text>
    <text x="416" y="422" font-size="13" fill="#3d3832">Rebuilds one half-inning</text>
    <text x="416" y="442" font-size="12" fill="#5c564c">A coherence check. Not a price</text>

    <line x1="200" y1="458" x2="200" y2="498" stroke="#3d3832" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="560" y1="326" x2="560" y2="620" stroke="#1d4e89" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="40" y="498" width="320" height="88" rx="12" fill="#e7f2eb" stroke="#1f6b4a" stroke-width="1.5"/>
    <text x="56" y="522" font-size="15" font-weight="650" fill="#1f6b4a">2D histograms written</text>
    <text x="56" y="544" font-size="13" fill="#243028">Home x away, and prop x total</text>
    <text x="56" y="564" font-size="12" fill="#5c564c">The live card does not read them</text>

    <line x1="200" y1="586" x2="200" y2="616" stroke="#3d3832" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="360" y1="537" x2="430" y2="640" stroke="#3d3832" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- pin -->
    <rect x="40" y="620" width="680" height="110" rx="14" fill="#1c1915"/>
    <text x="64" y="658" font-family="Georgia, Palatino, serif" font-size="22" fill="#f4f1ea">Exponential tilt</text>
    <text x="64" y="686" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#e4ddd2">One lambda for a prop. Alpha on the sum and beta on the margin for the</text>
    <text x="64" y="708" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#e4ddd2">moneyline and the total. The live card does not read this.</text>

    <line x1="180" y1="730" x2="140" y2="778" stroke="#3d3832" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="380" y1="730" x2="380" y2="778" stroke="#3d3832" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="580" y1="730" x2="620" y2="778" stroke="#3d3832" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="40" y="778" width="210" height="118" rx="12" fill="#e7eef6" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="56" y="810" font-size="14" font-weight="650" fill="#1d4e89">Cross-book read</text>
    <text x="56" y="834" font-size="12" fill="#1c2430">Pin to one main line</text>
    <text x="56" y="854" font-size="12" fill="#1c2430">Score a different line only</text>
    <text x="56" y="874" font-size="12" fill="#5c564c">A measurement, not a bet</text>

    <rect x="270" y="778" width="220" height="118" rx="12" fill="#eeeae4" stroke="#8a8178" stroke-width="1.5"/>
    <text x="286" y="810" font-size="14" font-weight="650" fill="#5c564c">Unshifted sim</text>
    <text x="286" y="834" font-size="12" fill="#3d3832">model_prob, as today</text>
    <text x="286" y="854" font-size="12" fill="#3d3832">Weight 0</text>
    <text x="286" y="874" font-size="12" fill="#5c564c">Health check, not a bet</text>

    <rect x="510" y="778" width="210" height="118" rx="12" fill="#eeeae4" stroke="#8a8178" stroke-width="1.5"/>
    <text x="526" y="810" font-size="14" font-weight="650" fill="#5c564c">Old coefficients</text>
    <text x="526" y="834" font-size="12" fill="#3d3832">0.78 total, 0.50 walks</text>
    <text x="526" y="854" font-size="12" fill="#3d3832">Named hypotheses</text>
    <text x="526" y="874" font-size="12" fill="#5c564c">Scored, not shipped</text>

    <line x1="145" y1="896" x2="300" y2="968" stroke="#3d3832" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="380" y="930" text-anchor="middle" font-size="12" fill="#5c564c">graded on the audit, not a path to a buy</text>

    <!-- gate -->
    <polygon points="380,948 560,1028 380,1108 200,1028" fill="#fff8ec" stroke="#8a5a00" stroke-width="1.6"/>
    <text x="380" y="1016" text-anchor="middle" font-size="13" font-weight="650" fill="#8a5a00">Gate shut</text>
    <text x="380" y="1036" text-anchor="middle" font-size="12" fill="#3d3832">no alternate keys fetched</text>
    <text x="380" y="1054" text-anchor="middle" font-size="11" fill="#5c564c">200 rows is a 2027 rule</text>

    <!-- sheets rail joins report -->
    <rect x="760" y="1048" width="320" height="78" rx="12" fill="#eeeae4" stroke="#8a8178" stroke-width="1.5"/>
    <text x="776" y="1078" font-size="14" font-weight="650" fill="#5c564c">Printed beside the price</text>
    <text x="776" y="1102" font-size="12" fill="#3d3832">Gap vs implied. SUM vs the line. Pin shift.</text>

    <line x1="250" y1="1088" x2="160" y2="1160" stroke="#3d3832" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="510" y1="1088" x2="600" y2="1160" stroke="#3d3832" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="150" y="1136" font-size="12" fill="#5c564c">this plan</text>
    <text x="520" y="1136" font-size="12" fill="#5c564c">later</text>

    <rect x="40" y="1160" width="280" height="88" rx="12" fill="#f8ecec" stroke="#8a3a3a" stroke-width="1.5"/>
    <text x="56" y="1194" font-size="15" font-weight="650" fill="#8a3a3a">Measurement only</text>
    <text x="56" y="1218" font-size="13" fill="#3d3832">Phases 1 to 3 buy nothing</text>

    <rect x="480" y="1160" width="280" height="88" rx="12" fill="#e7f2eb" stroke="#1f6b4a" stroke-width="1.5"/>
    <text x="496" y="1194" font-size="15" font-weight="650" fill="#1f6b4a">Buy waits</text>
    <text x="496" y="1218" font-size="13" fill="#243028">A later plan, alternate keys</text>

    <line x1="180" y1="1248" x2="300" y2="1300" stroke="#3d3832" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="620" y1="1248" x2="500" y2="1300" stroke="#3d3832" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="920" y1="1126" x2="760" y2="1336" stroke="#8a8178" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrSoft)"/>

    <rect x="200" y="1300" width="480" height="78" rx="12" fill="#1c1915"/>
    <text x="440" y="1330" text-anchor="middle" font-size="15" font-weight="650" fill="#f4f1ea">Morning audit</text>
    <text x="440" y="1354" text-anchor="middle" font-size="13" fill="#e4ddd2">clv_ev, clustered ROI, how far the sim had to be shifted</text>

    <!-- loop back -->
    <path d="M 680 1339 C 760 1339, 800 1028, 560 1028" fill="none" stroke="#8a5a00" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <text x="742" y="1188" font-size="11" fill="#8a5a00">next block</text>

    <!-- live band -->
    <rect x="40" y="1410" width="1040" height="78" rx="12" fill="none" stroke="#8a8178" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="60" y="1442" font-size="14" font-weight="650" fill="#5c564c">Live card, unchanged until an explicit cutover</text>
    <text x="60" y="1466" font-size="13" fill="#5c564c">Simulation, isotonic map, 0.90 anchor cap, EV screen. It does not read the shadow.</text>
  </g>
</svg>
